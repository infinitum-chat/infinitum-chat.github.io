<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketBase-test stap 2</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 680px; margin: 24px auto; padding: 0 16px; background: #111; color: #eee; }
  button, input { font: inherit; padding: 10px 12px; margin: 4px 0; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; }
  button { cursor: pointer; } input { width: 100%; box-sizing: border-box; }
  pre { background: #000; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>PocketBase-test stap 2</h1>
<p>Tijdelijk. Maakt een testprofiel in <b>PocketBase</b> (niet in Firestore) en ruimt het daarna op. Verwijder dit bestand na de test.</p>
<button id="g">Inloggen met Google en testen</button>
<p>of met e-mail:</p>
<input id="em" type="email" placeholder="e-mail" autocomplete="username">
<input id="pw" type="password" placeholder="wachtwoord" autocomplete="current-password">
<button id="ep">Inloggen met e-mail en testen</button>
<pre id="out">Nog niets gedaan.</pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const PB = "https://infinitum-db.tail15ab2e.ts.net";
const app = initializeApp({ apiKey: "AIzaSyBdA_VbJBO7JwrGIgEx9DcUr-ddREtEoQI", authDomain: "chat-a5794.firebaseapp.com", projectId: "chat-a5794", appId: "1:537984917384:web:f689560080e2cfd4a1243d" });
const auth = getAuth(app);
const out = document.getElementById("out");
const lines = [];
const log = (t) => { lines.push(t); out.textContent = lines.join("\n"); };

let token = "";
async function api(method, path, body) {
  const r = await fetch(PB + "/api/collections/" + path, { method, headers: { "Content-Type": "application/json", Authorization: token }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (_) {}
  return { ok: r.ok, status: r.status, j };
}
let pass = 0, fail = 0;
const expect = (name, res, shouldWork, extra) => {
  const good = res.ok === shouldWork && (!extra || extra(res.j));
  good ? pass++ : fail++;
  log((good ? "OK     " : "FOUT   ") + name + (good ? "" : "  -> status " + res.status + " " + JSON.stringify(res.j).slice(0, 300)));
};

async function run(cred) {
  lines.length = 0; pass = 0; fail = 0;
  const uid = cred.user.uid;
  const made = [];   // usernames-documenten om op te ruimen
  try {
    const login = await fetch(PB + "/api/fb-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idToken: await cred.user.getIdToken() }) });
    const lj = await login.json();
    if (!login.ok) { log("Inloggen bij PocketBase mislukt: " + JSON.stringify(lj)); return; }
    token = lj.token; log("Ingelogd als " + uid + "\n");

    const nm = "pbtest" + Math.random().toString(36).slice(2, 8);
    const nm2 = nm + "x";

    expect("profiel lezen zonder bestaand profiel (404 hoort)", await api("GET", "users/records/" + uid), false);
    expect("gebruikersnaam vastleggen", await api("POST", "usernames/records", { id: nm, uid }), true); made.push(nm);
    expect("naam van iemand anders vastleggen wordt geweigerd", await api("POST", "usernames/records", { id: nm + "z", uid: "abcdefghijklmnopqrstuvwxyz12" }), false);
    expect("profiel aanmaken", await api("POST", "users/records", { id: uid, username: nm, usernameLower: nm, status: "test" }), true, j => j.tier === "free" && !!j.createdAt);
    expect("alle profielen lezen", await api("GET", "users/records?perPage=5"), true, j => Array.isArray(j.items));
    expect("status wijzigen", await api("PATCH", "users/records/" + uid, { status: "nieuw" }), true, j => j.status === "nieuw");
    expect("abonnement zelf verhogen wordt geweigerd", await api("PATCH", "users/records/" + uid, { tier: "prime" }), false);
    expect("bio van 201 tekens wordt geweigerd", await api("PATCH", "users/records/" + uid, { bio: "x".repeat(201) }), false);
    expect("7 links wordt geweigerd", await api("PATCH", "users/records/" + uid, { links: [1, 2, 3, 4, 5, 6, 7] }), false);
    expect("bannerafbeelding zonder Plus wordt geweigerd", await api("PATCH", "users/records/" + uid, { banner: "data:image/png;base64,AAAA" }), false);
    expect("bannerkleur mag wel", await api("PATCH", "users/records/" + uid, { banner: "#aabbcc" }), true);
    expect("muziekstatus met vreemde hoes wordt geweigerd", await api("PATCH", "users/records/" + uid, { activity: { k: "music", t: "a", a: "b", i: "https://evil.example/x.jpg" } }), false);
    expect("muziekstatus mag wel", await api("PATCH", "users/records/" + uid, { activity: { k: "music", t: "Song", a: "Artiest", at: Date.now() } }), true);
    expect("muziekstatus wissen", await api("PATCH", "users/records/" + uid, { activity: null }), true);
    expect("naam wijzigen zonder die vast te leggen wordt geweigerd", await api("PATCH", "users/records/" + uid, { username: nm2, usernameLower: nm2 }), false);
    expect("nieuwe naam vastleggen", await api("POST", "usernames/records", { id: nm2, uid }), true); made.push(nm2);
    expect("naam wijzigen", await api("PATCH", "users/records/" + uid, { username: nm2, usernameLower: nm2 }), true, j => !!j.usernameChangedAt);
    expect("opnieuw naam wijzigen (binnen 7 dagen) wordt geweigerd", await api("PATCH", "users/records/" + uid, { username: nm, usernameLower: nm }), false);
    expect("gebruikersnamen oplijsten wordt geweigerd", await api("GET", "usernames/records"), false);
    expect("badges lezen", await api("GET", "badges/records"), true);
  } catch (e) {
    log("Fout: " + (e && e.message || e)); fail++;
  } finally {
    // opruimen
    try { await api("DELETE", "users/records/" + uid); } catch (_) {}
    for (const n of made) { try { await api("DELETE", "usernames/records/" + n); } catch (_) {} }
    log("\nOpgeruimd. " + pass + " goed, " + fail + " fout.");
  }
}

document.getElementById("g").onclick = async () => {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  try { await run(await signInWithPopup(auth, p)); } catch (e) { log("Google-login mislukt: " + e.message); }
};
document.getElementById("ep").onclick = async () => {
  try { await run(await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value)); }
  catch (e) { log("E-mail-login mislukt: " + e.message); }
};
</script>
</body>
</html>
