<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050816">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Infinitum">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>Infinitum</title>
  <script>
    /* thema + achtergrond meteen toepassen (voorkomt een flits bij het laden) */
    try {
      var s = JSON.parse(localStorage.getItem('infinitum-settings') || '{}');
      var t = s.theme || 'dark';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.bg = ['cosmos', 'aurora', 'sunset', 'ocean', 'nevel', 'neon', 'bergen', 'kristal', 'melkweg', 'aarde', 'custom'].indexOf(s.bg) > -1 ? s.bg : 'cosmos';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="icon" id="favicon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.5">
  <script type="module" src="js/app.js?v=1.0.5"></script>
</head>
<body>
  <!-- gedeelde gradient voor het verstuur-icoon -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gradSend" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c5cff"/>
        <stop offset=".55" stop-color="#c24dff"/>
        <stop offset="1" stop-color="#ff62d3"/>
      </linearGradient>
      <!-- v0.37: Sparks-icoon -->
      <linearGradient id="gradSpark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6ee7ff"/>
        <stop offset=".5" stop-color="#8b6cff"/>
        <stop offset="1" stop-color="#ff62d3"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ===== inloggen ===== -->
  <section id="auth" class="auth">
    <div class="auth-card panel">
      <img class="auth-logo" src="assets/infinitum-logo.svg" alt="Infinitum">
      <div class="seg" id="authSeg">
        <button type="button" data-mode="login" class="active">Inloggen</button>
        <button type="button" data-mode="signup">Account maken</button>
      </div>
      <form id="authForm" novalidate>
        <label class="field" id="userField" hidden>
          <span>Gebruikersnaam</span>
          <input id="aUser" autocomplete="username" maxlength="20" placeholder="bijv. kaasfan">
        </label>
        <label class="field">
          <span>E-mail</span>
          <input id="aMail" type="email" autocomplete="email" placeholder="jij@voorbeeld.nl">
        </label>
        <label class="field">
          <span>Wachtwoord</span>
          <input id="aPass" type="password" autocomplete="current-password" placeholder="Minimaal 6 tekens">
        </label>
        <button class="link-btn" id="aForgot" type="button">Account of wachtwoord vergeten?</button>
        <label class="up-check auth-agree" id="agreeField" hidden>
          <input type="checkbox" id="aAgree">
          <span>Ik ga akkoord met de <a href="#" data-legal="terms">Algemene voorwaarden</a>, het <a href="#" data-legal="privacy">Privacybeleid</a> en de <a href="#" data-legal="rules">Huisregels</a>.</span>
        </label>
        <p id="aErr" class="err" role="alert"></p>
        <button class="glow wide" id="aSubmit" type="submit">Inloggen</button>
      </form>
      <div class="or"><span>of</span></div>
      <button class="ghost wide" id="aGoogle" type="button">Doorgaan met Google</button>
      <p class="auth-legal"><a href="#" data-legal="terms">Algemene voorwaarden</a> · <a href="#" data-legal="privacy">Privacybeleid</a> · <a href="#" data-legal="rules">Huisregels</a></p>
      <p class="app-ver"></p>
    </div>
  </section>

  <!-- ===== de app ===== -->
  <div id="app" class="app" data-view="list" hidden>
    <header class="topbar panel">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="dms" title="DM's"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></span><span class="tab-t">DM's</span><span class="unread" id="dmBadge" hidden></span></button>
        <button class="tab" data-tab="servers" title="Servers"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></span><span class="tab-t">Servers</span><span class="unread" id="srvBadge" hidden></span></button>
        <button class="tab" data-tab="friends" title="Friends"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.2a6.5 6.5 0 0 1 3 5.8"/></svg></span><span class="tab-t">Friends</span><span class="badge" id="reqBadge" hidden></span></button>
        <button class="tab" data-tab="streakr" title="Streakr"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.2 1.2.8 2 1.6 2.4C10.3 8.6 10.6 5.8 12 3z"/></svg></span><span class="tab-t">Streakr</span><span class="unread" id="stkBadge" hidden></span></button>
        <button class="tab" data-tab="sparks" title="Sparks"><span class="tab-ic spark"><svg viewBox="0 0 24 24" fill="url(#gradSpark)" aria-hidden="true"><path class="spk-a" d="M10 6C10.7 10.3 13.7 13.3 18 14 13.7 14.7 10.7 17.7 10 22 9.3 17.7 6.3 14.7 2 14 6.3 13.3 9.3 10.3 10 6z"/><path class="spk-b" d="M18 2C18.35 4.2 19.8 5.65 22 6 19.8 6.35 18.35 7.8 18 10 17.65 7.8 16.2 6.35 14 6 16.2 5.65 17.65 4.2 18 2z"/><path class="spk-c" d="M5 2.8C5.2 4 6 4.8 7.2 5 6 5.2 5.2 6 5 7.2 4.8 6 4 5.2 2.8 5 4 4.8 4.8 4 5 2.8z"/></svg></span><span class="tab-t">Sparks</span></button>
      </nav>
      <div class="top-actions">
        <button class="ghost admin-btn" id="adminBtn" type="button" hidden>Admin<span class="unread" id="admBadge" hidden></span></button>
        <button class="ghost bell-btn" id="inboxBtn" type="button" aria-label="Meldingen" title="Meldingen"></button>
        <button class="glow premium" id="premiumBtn" type="button" aria-label="Infinitum Premium">
          <img src="assets/logo-dark.svg" alt="Infinitum">
        </button>
      </div>
    </header>

    <aside class="sidebar panel">
      <div class="me">
        <span id="meAvatar"></span>
        <div class="me-text">
          <span class="me-name" id="meName">…</span>
        </div>
        <button class="icon-btn" id="settingsBtn" type="button" title="Instellingen" aria-label="Instellingen"></button>
        <button class="icon-btn" id="logoutBtn" type="button" title="Uitloggen" aria-label="Uitloggen"></button>
      </div>
      <div class="flowline"></div>
      <h3 class="side-title" id="sideTitle">Directe berichten</h3>
      <div class="side-list" id="sideList"></div>
      <div class="side-foot" id="sideFoot"></div>
      <div class="app-ver"></div>
    </aside>

    <main class="main panel" id="main"></main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
