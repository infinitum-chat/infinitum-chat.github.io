<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketBase-test stap 3</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #111; color: #eee; }
  button, input { font: inherit; padding: 10px 12px; margin: 4px 0; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; }
  button { cursor: pointer; } button:disabled { opacity: .5; cursor: wait; } input { width: 100%; box-sizing: border-box; }
  pre { background: #000; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>PocketBase-test stap 3</h1>
<p>Tijdelijk. Maakt een testprofiel plus testgegevens in <b>PocketBase</b> (niet in Firestore) en ruimt alles daarna op. Verwijder dit bestand na de test.</p>
<button id="g">Inloggen met Google en testen</button>
<p>of met e-mail:</p>
<input id="em" type="email" placeholder="e-mail" autocomplete="username">
<input id="pw" type="password" placeholder="wachtwoord" autocomplete="current-password">
<button id="ep">Inloggen met e-mail en testen</button>
<pre id="out">Nog niets gedaan.</pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const PB = "https://infinitum-db.tail15ab2e.ts.net";
const app = initializeApp({ apiKey: "AIzaSyBdA_VbJBO7JwrGIgEx9DcUr-ddREtEoQI", authDomain: "chat-a5794.firebaseapp.com", projectId: "chat-a5794", appId: "1:537984917384:web:f689560080e2cfd4a1243d" });
const auth = getAuth(app);
const out = document.getElementById("out");
const lines = [];
const log = (t) => { lines.push(t); out.textContent = lines.join("\n"); };

let token = "";
async function api(method, path, body, anon) {
  const headers = { "Content-Type": "application/json" };
  if (!anon) headers.Authorization = token;
  const r = await fetch(PB + "/api/collections/" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (_) {}
  return { ok: r.ok, status: r.status, j };
}
let pass = 0, fail = 0, skipped = 0;
const expect = (name, res, shouldWork, extra) => {
  const good = res.ok === shouldWork && (!extra || extra(res.j));
  good ? pass++ : fail++;
  log((good ? "OK     " : "FOUT   ") + name + (good ? "" : "  -> status " + res.status + " " + JSON.stringify(res.j).slice(0, 300)));
};
// zonder in te loggen: een fout (403/404) of een lege lijst betekent allebei "niets te zien"
const expectNone = (name, res) => {
  const good = !res.ok || (Array.isArray(res.j.items) && res.j.items.length === 0);
  good ? pass++ : fail++;
  log((good ? "OK     " : "FOUT   ") + name + (good ? "" : "  -> status " + res.status + " " + JSON.stringify(res.j).slice(0, 300)));
};
const skip = (name, why) => { skipped++; log("OVER   " + name + "  (" + why + ")"); };
const NOTIF = { desktop: false, sound: true, dm: true, server: true, mention: true, requests: true, preview: true, pcQuiet: true };
const OTHER = "abcdefghijklmnopqrstuvwxyz12";   // een uid die niet van jou is

async function run(cred) {
  lines.length = 0; pass = 0; fail = 0; skipped = 0;
  const uid = cred.user.uid;
  const made = { usernames: [], features: [] };
  const mine = [];   // [collectie, id] om op te ruimen
  try {
    const login = await fetch(PB + "/api/fb-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idToken: await cred.user.getIdToken() }) });
    const lj = await login.json();
    if (!login.ok) { log("Inloggen bij PocketBase mislukt: " + JSON.stringify(lj)); return; }
    token = lj.token; log("Ingelogd als " + uid + "\n");

    // een testprofiel (nodig: het abonnement uit je profiel bepaalt welke achtergronden mogen)
    const nm = "pbtest" + Math.random().toString(36).slice(2, 8);
    const has = await api("GET", "users/records/" + uid);
    if (has.ok) { log("Je hebt al een profiel in PocketBase; de test wordt gestopt zodat er niets van jou wordt overschreven."); return; }
    expect("testprofiel: gebruikersnaam vastleggen", await api("POST", "usernames/records", { id: nm, uid }), true); made.usernames.push(nm);
    expect("testprofiel aanmaken (tier = free)", await api("POST", "users/records", { id: uid, username: nm, usernameLower: nm, status: "test" }), true, j => j.tier === "free");
    mine.push(["users", uid]);

    // admin? (uid staat in badges/moderator.users, zoals in de app)
    const mb = await api("GET", "badges/records/moderator");
    const isAdmin = mb.ok && Array.isArray(mb.j.users) && mb.j.users.indexOf(uid) >= 0;
    log("Beheerder: " + (isAdmin ? "ja (badge moderator)" : "nee") + "\n");

    /* ---------- settings ---------- */
    log("--- settings ---");
    const setBody = { id: uid, theme: "dark", bg: "cosmos", profileClick: true, pins: [], privacy: { readReceipts: true }, notif: NOTIF };
    expect("instellingen lezen zonder bestaand document (404 hoort)", await api("GET", "settings/records/" + uid), false);
    expect("instellingen aanmaken", await api("POST", "settings/records", setBody), true, j => j.theme === "dark"); mine.push(["settings", uid]);
    expect("instellingen van een ander lezen wordt geweigerd", await api("GET", "settings/records/" + OTHER), false);
    expect("instellingen voor een ander aanmaken wordt geweigerd", await api("POST", "settings/records", Object.assign({}, setBody, { id: OTHER })), false);
    expect("oplijsten geeft alleen jezelf", await api("GET", "settings/records"), true, j => j.items.length === 1 && j.items[0].id === uid);
    expect("onbekend thema wordt geweigerd", await api("PATCH", "settings/records/" + uid, { theme: "rood" }), false);
    expect("gratis achtergrond kiezen", await api("PATCH", "settings/records/" + uid, { bg: "aurora" }), true, j => j.bg === "aurora");
    expect("nevel zonder abonnement wordt geweigerd", await api("PATCH", "settings/records/" + uid, { bg: "nevel" }), false);
    expect("melkweg zonder abonnement wordt geweigerd", await api("PATCH", "settings/records/" + uid, { bg: "melkweg" }), false);
    expect("eigen achtergrond zonder Plus wordt geweigerd", await api("PATCH", "settings/records/" + uid, { customBg: "data:image/jpeg;base64,AAAA" }), false);
    expect("4 vastgepinde chats wordt geweigerd", await api("PATCH", "settings/records/" + uid, { pins: ["a", "b", "c", "d"] }), false);
    expect("3 vastgepinde chats mag", await api("PATCH", "settings/records/" + uid, { pins: ["a", "b", "c"] }), true);
    expect("privacy met extra sleutel wordt geweigerd", await api("PATCH", "settings/records/" + uid, { privacy: { readReceipts: true, x: 1 } }), false);
    expect("meldingen met ontbrekende sleutel wordt geweigerd", await api("PATCH", "settings/records/" + uid, { notif: { desktop: true } }), false);
    expect("meldingen wijzigen", await api("PATCH", "settings/records/" + uid, { notif: Object.assign({}, NOTIF, { desktop: true }) }), true, j => j.notif && j.notif.desktop === true);
    expect("Last.fm-naam die met een cijfer begint wordt geweigerd", await api("PATCH", "settings/records/" + uid, { lastfm: { user: "1abc" } }), false);
    expect("Last.fm koppelen", await api("PATCH", "settings/records/" + uid, { lastfm: { user: "testgebruiker", show: true, prompt: "ask", bg: false } }), true);
    expect("Last.fm ontkoppelen (null)", await api("PATCH", "settings/records/" + uid, { lastfm: null }), true);

    /* ---------- presenceSettings ---------- */
    log("\n--- presenceSettings ---");
    expect("status aanmaken (niet storen, voor altijd)", await api("POST", "presenceSettings/records", { id: uid, mode: "dnd", until: 0 }), true, j => j.mode === "dnd" && j.until === 0); mine.push(["presenceSettings", uid]);
    expect("onbekende modus wordt geweigerd", await api("PATCH", "presenceSettings/records/" + uid, { mode: "weg" }), false);
    expect("negatieve until wordt geweigerd", await api("PATCH", "presenceSettings/records/" + uid, { until: -1 }), false);
    expect("status met einde wijzigen", await api("PATCH", "presenceSettings/records/" + uid, { mode: "invisible", until: Date.now() + 60000 }), true, j => j.mode === "invisible");
    expect("status van een ander aanmaken wordt geweigerd", await api("POST", "presenceSettings/records", { id: OTHER, mode: "idle", until: 0 }), false);
    expect("status van een ander lezen wordt geweigerd", await api("GET", "presenceSettings/records/" + OTHER), false);

    /* ---------- readState ---------- */
    log("\n--- readState ---");
    expect("gelezen-status aanmaken", await api("POST", "readState/records", { id: uid, r: { "dm|aaa": 1000 } }), true); mine.push(["readState", uid]);
    expect("wijziging wordt samengevoegd (merge): oude sleutel blijft", await api("PATCH", "readState/records/" + uid, { r: { "dm|bbb": 2000 } }), true, j => j.r && j.r["dm|aaa"] === 1000 && j.r["dm|bbb"] === 2000);
    expect("bestaande sleutel overschrijven", await api("PATCH", "readState/records/" + uid, { r: { "dm|aaa": 3000 } }), true, j => j.r["dm|aaa"] === 3000 && j.r["dm|bbb"] === 2000);
    expect("lijst i.p.v. object wordt geweigerd", await api("PATCH", "readState/records/" + uid, { r: [1, 2, 3] }), false);
    const many = {}; for (let i = 0; i < 2000; i++) many["k" + i] = i;
    expect("meer dan 2000 sleutels wordt geweigerd", await api("PATCH", "readState/records/" + uid, { r: many }), false);
    expect("gelezen-status van een ander lezen wordt geweigerd", await api("GET", "readState/records/" + OTHER), false);

    /* ---------- sparks ---------- */
    log("\n--- sparks ---");
    expect("aanmaken met saldo 5 wordt geweigerd", await api("POST", "sparks/records", { id: uid, sparks_balance: 5, quests_completed: 0 }), false);
    expect("aanmaken met 0 en 0", await api("POST", "sparks/records", { id: uid, sparks_balance: 0, quests_completed: 0 }), true, j => j.sparks_balance === 0 && !!j.last_online_at); mine.push(["sparks", uid]);
    expect("saldo zelf verhogen wordt geweigerd", await api("PATCH", "sparks/records/" + uid, { sparks_balance: 10 }), false);
    expect("quests zelf verhogen wordt geweigerd", await api("PATCH", "sparks/records/" + uid, { quests_completed: 1 }), false);
    expect("last_online_at bijwerken: de server zet de tijd zelf", await api("PATCH", "sparks/records/" + uid, { last_online_at: "2001-01-01 00:00:00.000Z" }), true, j => new Date(j.last_online_at.replace(" ", "T")).getFullYear() >= 2024);
    expect("sparks van een ander aanmaken wordt geweigerd", await api("POST", "sparks/records", { id: OTHER, sparks_balance: 0, quests_completed: 0 }), false);
    expect("sparks van iedereen lezen (ranglijst) mag", await api("GET", "sparks/records?perPage=5"), true, j => Array.isArray(j.items));

    /* ---------- legal ---------- */
    log("\n--- legal ---");
    expect("voorwaarden oplijsten zonder in te loggen", await api("GET", "legal/records", null, true), true, j => Array.isArray(j.items));
    if (!isAdmin) {
      const msg = j => /beheerder/i.test(j.message || "");
      expect("voorwaarden schrijven als gewone gebruiker wordt geweigerd", await api("POST", "legal/records", { id: "rules", text: "x".repeat(40) }), false, msg);
    } else skip("voorwaarden schrijven als gewone gebruiker", "je bent beheerder; je zou echte voorwaarden aanpassen");

    /* ---------- config ---------- */
    log("\n--- config ---");
    expect("config oplijsten (ingelogd)", await api("GET", "config/records"), true, j => Array.isArray(j.items));
    expectNone("config oplijsten zonder in te loggen toont niets", await api("GET", "config/records", null, true));
    if (!isAdmin) {
      const msg = j => /beheerder|beheerpaneel/i.test(j.message || "");
      expect("config/streakr schrijven als gewone gebruiker wordt geweigerd", await api("POST", "config/records", { id: "streakr", storage: "firestore" }), false, msg);
      expect("config/features schrijven als gewone gebruiker wordt geweigerd", await api("POST", "config/records", { id: "features", data: { voice: false } }), false, msg);
    } else skip("config schrijven als gewone gebruiker", "je bent beheerder; config/streakr zou echt veranderen");

    /* ---------- features ---------- */
    log("\n--- features ---");
    expect("functielijst lezen (ingelogd)", await api("GET", "features/records"), true, j => Array.isArray(j.items));
    expectNone("functielijst lezen zonder in te loggen toont niets", await api("GET", "features/records", null, true));
    if (!isAdmin) {
      const msg = j => /beheerder/i.test(j.message || "");
      expect("functie toevoegen als gewone gebruiker wordt geweigerd", await api("POST", "features/records", { name: "pbtest", free: true, plus: true, prime: true, order: 9999 }), false, msg);
    } else {
      const ok = { name: "pbtest functie", free: false, plus: true, prime: "Onbeperkt", order: 9999 };
      const c = await api("POST", "features/records", ok);
      expect("functie toevoegen als beheerder", c, true, j => j.prime === "Onbeperkt" && j.free === false);
      if (c.ok) made.features.push(c.j.id);
      if (c.ok) {
        expect("functie wijzigen als beheerder", await api("PATCH", "features/records/" + c.j.id, { plus: "Ja" }), true, j => j.plus === "Ja");
        expect("cel van 31 tekens wordt geweigerd", await api("PATCH", "features/records/" + c.j.id, { plus: "x".repeat(31) }), false);
        expect("cel met een getal wordt geweigerd", await api("PATCH", "features/records/" + c.j.id, { plus: 5 }), false);
      }
      skip("legal en config/streakr schrijven als beheerder", "zou je echte voorwaarden/instelling overschrijven; test dat handmatig of met een superuser-token");
    }

    /* ---------- blocks ---------- */
    log("\n--- blocks ---");
    const bid = uid + "_" + OTHER;
    expect("blokkeren", await api("POST", "blocks/records", { id: bid, blocker: uid, blocked: OTHER, blockedName: "Test" }), true, j => !!j.createdAt); mine.push(["blocks", bid]);
    expect("blokkade van een ander (blocker is niet jij) wordt geweigerd", await api("POST", "blocks/records", { id: OTHER + "_" + uid, blocker: OTHER, blocked: uid, blockedName: "x" }), false);
    expect("jezelf blokkeren wordt geweigerd", await api("POST", "blocks/records", { id: uid + "_" + uid, blocker: uid, blocked: uid, blockedName: "x" }), false);
    expect("id dat niet klopt wordt geweigerd", await api("POST", "blocks/records", { id: uid + "_" + "z".repeat(28), blocker: uid, blocked: OTHER, blockedName: "x" }), false);
    expect("naam van 21 tekens wordt geweigerd", await api("POST", "blocks/records", { id: uid + "_" + "y".repeat(28), blocker: uid, blocked: "y".repeat(28), blockedName: "x".repeat(21) }), false);
    expect("oplijsten geeft alleen jouw blokkades", await api("GET", "blocks/records"), true, j => j.items.length >= 1 && j.items.every(b => b.blocker === uid));
    expect("blokkade wijzigen wordt geweigerd", await api("PATCH", "blocks/records/" + bid, { blockedName: "Nieuw" }), false);
    expect("blokkade van een ander lezen wordt geweigerd", await api("GET", "blocks/records/" + OTHER + "_" + uid), false);
    expect("deblokkeren", await api("DELETE", "blocks/records/" + bid), true); mine.pop();
  } catch (e) {
    log("Fout: " + (e && e.message || e)); fail++;
  } finally {
    // opruimen (profiel als laatste; de gebruikersnaam daarna)
    for (const [col, id] of mine.slice().reverse()) { try { await api("DELETE", col + "/records/" + id); } catch (_) {} }
    for (const id of made.features) { try { await api("DELETE", "features/records/" + id); } catch (_) {} }
    for (const n of made.usernames) { try { await api("DELETE", "usernames/records/" + n); } catch (_) {} }
    log("\nOpgeruimd. " + pass + " goed, " + fail + " fout" + (skipped ? ", " + skipped + " overgeslagen" : "") + ".");
  }
}

// Maar één run tegelijk: twee runs met hetzelfde uid botsen op elkaar (zelfde record-id's) en geven schijnfouten.
let busy = false;
const setBusy = (b) => { busy = b; document.getElementById("g").disabled = b; document.getElementById("ep").disabled = b; };
const once = (fn) => async () => { if (busy) return; setBusy(true); try { await fn(); } finally { setBusy(false); } };
document.getElementById("g").onclick = once(async () => {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  try { await run(await signInWithPopup(auth, p)); } catch (e) { log("Google-login mislukt: " + e.message); }
});
document.getElementById("ep").onclick = once(async () => {
  try { await run(await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value)); }
  catch (e) { log("E-mail-login mislukt: " + e.message); }
});
</script>
</body>
</html>
